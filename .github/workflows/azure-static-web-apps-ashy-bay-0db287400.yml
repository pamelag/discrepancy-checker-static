# Deploys the Data Discrepancy Reporter to Azure Static Web Apps.
#
# - Every push to main updates the live site.
# - Every pull request into main gets its own preview site, which is removed
#   when the pull request is closed.
#
# One-time setup: add the deployment token as a repository secret named
# AZURE_STATIC_WEB_APPS_API_TOKEN (see README.md, "Deploy with GitHub Actions").

name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pull-requests: write      # lets the deploy step comment the preview link on pull requests

concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_BAY_0DB287400 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"         # the folder that holds index.html
          api_location: ""          # no API in this repository
          output_location: ""       # nothing is built
          skip_app_build: true      # plain HTML, CSS and JavaScript: deploy the files as they are

  close_preview:
    name: Remove pull request preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the preview site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_BAY_0DB287400 }}
          action: close
